# Roadie phone network settings: /etc/roadie/phone-net.conf
#
# Read by roadie-phone-net@<interface>.service. Every line here is the
# built-in default; uncomment one to change it, then:
#   sudo systemctl restart 'roadie-phone-net@*'

# The only interface the phone's traffic may leave by (NATed).
#UPSTREAM_IF=eth0

# The phone link. Must not overlap any network this Pi is on; the service
# refuses to start if it does.
#PHONE_SUBNET=192.168.42.0/24
#PHONE_GATEWAY=192.168.42.1        # this Pi, as the phone sees it
#PHONE_IP=192.168.42.2             # the phone, always (pinned to its MAC)
#DHCP_RANGE="192.168.42.10,192.168.42.50"
#LEASE_TIME=12h

# DNS servers handed out are always this Pi; it forwards to these, or to
# whatever this Pi itself uses when empty.
#DNS_SERVERS=""

# Isolation. The phone can reach the internet and nothing private: not this
# Pi (beyond DHCP, DNS and ping), not the LAN, not other private ranges.
#BLOCK_PRIVATE=1
#ALLOW_DESTS=""                    # e.g. "10.20.0.0/16 192.168.7.7"
#ALLOW_PI_TCP_PORTS=""             # e.g. "8080" to let the phone open roadie
