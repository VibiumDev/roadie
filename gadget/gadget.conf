# Roadie USB gadget settings: /etc/roadie/gadget.conf
#
# Read by roadie-gadget at boot. Every line here is the built-in default;
# uncomment one to change it, then: sudo systemctl restart roadie-gadget
# A changed setting rebuilds the gadget, which the phone sees as a replug.

# USB identity. 1d6b:0104 is the Linux Foundation's "Multifunction Composite
# Gadget" ID, the one the kernel's own g_multi uses. A fleet should use its
# own vendor/product allocation.
#USB_VENDOR_ID=0x1d6b
#USB_PRODUCT_ID=0x0104
#USB_MANUFACTURER="Vibium"
#USB_PRODUCT="Roadie"
#USB_SERIAL=""                  # empty: this Pi's serial number

# Input devices.
#HID_KEYBOARD=1
#HID_MOUSE=1
#HID_TOUCH=1

# Audio: uac2 (default), uac1 for phones with poor UAC2 support, or none.
# With the speaker on, Android plays its audio over USB and roadie's /audio
# carries it; with it off, Android keeps audio on HDMI and roadie uses the
# capture dongle's audio as before.
#AUDIO=uac2
#AUDIO_MIC=1
#AUDIO_SPEAKER=1
#AUDIO_RATE=48000
#AUDIO_MIC_CHANNELS=1
#AUDIO_SPEAKER_CHANNELS=2

# Network: ecm (default), ncm, rndis, or none.
#NET=ecm
#NET_IFNAME="phone%d"           # the interface on this Pi; phone0 in practice
#NET_HOST_MAC=""                # phone side; must NOT be locally administered,
                                # or Android ignores the link. Empty: eth0's MAC.
#NET_DEV_MAC=""                 # Pi side. Empty: NET_HOST_MAC, locally administered

# Group whose members may use the gadget's device nodes (roadie's service user).
#GADGET_GROUP=roadie

# USB device controller. Empty: the only one there is.
#UDC=""
