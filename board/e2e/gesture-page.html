<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>roadie gestures</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  html, body { height: 100%; }
  body {
    background: #11141c; color: #c8d0e0; font-family: ui-monospace, monospace;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  #stage { flex: 1; display: grid; place-items: center; position: relative; }
  #guitar {
    display: block; will-change: transform;
    transform: translate(0px, 0px) scale(1) rotate(0deg);
    transform-origin: center center;
  }
  #readout {
    padding: 10px 14px; background: #0b0e14; border-top: 1px solid #222a3a;
    display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px;
  }
  #readout b { color: #7ee2a8; font-weight: normal; }
  .dot {
    position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; background: #b89cff55; border: 1px solid #b89cffaa;
    pointer-events: none; display: none;
  }
  #hint { position: absolute; top: 12px; color: #55607a; font-size: 13px; }
</style>

<div id="stage">
  <div id="hint">pinch to zoom &middot; twist to rotate &middot; drag to move</div>
  <!-- Drawn rather than an emoji: the system emoji font is bitmap only
       (CBDT/CBLC), so a pinch to 2x turns it to mush. This stays sharp at
       any scale, which is the whole point of the page. -->
  <svg id="guitar" viewBox="0 0 160 330" width="170" height="350"
       xmlns="http://www.w3.org/2000/svg" aria-label="electric guitar">
    <!-- A Flying V: angular, so it stays sharp and obvious at any scale.
         Drawn rather than an emoji: the system emoji font is bitmap only
         (CBDT/CBLC), so pinching one to 2x turns it to mush. -->
    <!-- body -->
    <path d="M58 168 L12 286 L42 304 L80 250 L118 304 L148 286 L102 168 Z"
          fill="#e03a2f" stroke="#8c1c14" stroke-width="3"
          stroke-linejoin="round"/>
    <!-- a highlight down the left wing -->
    <path d="M58 168 L22 260 L34 266 L68 178 Z" fill="#f4664f" opacity="0.55"/>
    <!-- pickups, bridge, knobs -->
    <rect x="58" y="182" width="44" height="11" rx="2.5" fill="#15191f"/>
    <rect x="62" y="206" width="36" height="11" rx="2.5" fill="#15191f"/>
    <rect x="66" y="230" width="28" height="8" rx="2" fill="#aab3c0"/>
    <circle cx="112" cy="252" r="5" fill="#20262f"/>
    <circle cx="124" cy="268" r="5" fill="#20262f"/>
    <!-- neck and fretboard -->
    <rect x="69" y="56" width="22" height="118" fill="#8a5a2b"/>
    <rect x="70.5" y="56" width="19" height="114" fill="#2f1d0f"/>
    <g stroke="#c3cad6" stroke-width="1.2">
      <line x1="70.5" y1="74" x2="89.5" y2="74"/>
      <line x1="70.5" y1="92" x2="89.5" y2="92"/>
      <line x1="70.5" y1="110" x2="89.5" y2="110"/>
      <line x1="70.5" y1="128" x2="89.5" y2="128"/>
      <line x1="70.5" y1="146" x2="89.5" y2="146"/>
    </g>
    <!-- pointed headstock, angled the way a V's is -->
    <path d="M67 54 L93 54 L108 14 L88 6 L64 10 Z"
          fill="#8a5a2b" stroke="#54351a" stroke-width="1.5"
          stroke-linejoin="round"/>
    <g fill="#ccd4e0">
      <circle cx="70" cy="22" r="3"/><circle cx="78" cy="18" r="3"/>
      <circle cx="86" cy="14" r="3"/><circle cx="94" cy="30" r="3"/>
      <circle cx="101" cy="26" r="3"/><circle cx="76" cy="34" r="3"/>
    </g>
    <rect x="67" y="52" width="26" height="4" rx="1" fill="#eef2f7"/>
    <!-- strings -->
    <g stroke="#eef2f7" stroke-width="0.9" opacity="0.92">
      <line x1="73" y1="54" x2="68" y2="234"/>
      <line x1="75.8" y1="54" x2="73" y2="234"/>
      <line x1="78.6" y1="54" x2="78" y2="234"/>
      <line x1="81.4" y1="54" x2="82" y2="234"/>
      <line x1="84.2" y1="54" x2="87" y2="234"/>
      <line x1="87" y1="54" x2="92" y2="234"/>
    </g>
  </svg>
  <div class="dot" id="d0"></div>
  <div class="dot" id="d1"></div>
</div>
<div id="readout">
  <span>contacts <b id="n">0</b></span>
  <span>scale <b id="s">1.00</b></span>
  <span>rotation <b id="r">0</b>&deg;</span>
  <span>moved <b id="m">0,0</b></span>
  <span id="peakwrap">most at once <b id="peak">0</b></span>
</div>

<script>
// Shows what a multi-touch gesture does, and reports it back so a test can
// check the gesture was understood rather than only that events arrived.
//
// Opens standalone too: without a collector the reports fail quietly, so
// this doubles as something to poke at by hand.
const guitar = document.getElementById('guitar');
const dots = [document.getElementById('d0'), document.getElementById('d1')];
const out = {
  n: document.getElementById('n'), s: document.getElementById('s'),
  r: document.getElementById('r'), m: document.getElementById('m'),
  peak: document.getElementById('peak'),
};

let scale = 1, rotation = 0, tx = 0, ty = 0, peak = 0, seq = 0;
let base = null;   // gesture start: distance, angle, scale, rotation, centre

function report(kind, data) {
  data.kind = kind;
  data.seq = seq++;
  fetch('/report', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
    keepalive: true,
  }).catch(() => {});
}

function show(touches) {
  out.n.textContent = touches.length;
  out.s.textContent = scale.toFixed(2);
  out.r.textContent = Math.round(rotation);
  out.m.textContent = Math.round(tx) + ',' + Math.round(ty);
  out.peak.textContent = peak;
  for (let i = 0; i < 2; i++) {
    const t = touches[i];
    dots[i].style.display = t ? 'block' : 'none';
    if (t) {
      dots[i].style.left = t.clientX + 'px';
      dots[i].style.top = t.clientY + 'px';
    }
  }
}

function pairOf(touches) {
  const [a, b] = touches;
  return {
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
    angle: Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) * 180 / Math.PI,
    cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2,
  };
}

function onTouch(e) {
  const touches = Array.from(e.touches);
  peak = Math.max(peak, touches.length);

  if (touches.length >= 2) {
    const now = pairOf(touches);
    if (!base || base.n < 2) {
      base = {n: 2, dist: now.dist, angle: now.angle, scale: scale,
              rotation: rotation, cx: now.cx, cy: now.cy, tx: tx, ty: ty};
    } else {
      // Pinch sets the scale, twist sets the rotation, and the midpoint
      // moving carries the whole thing along.
      if (base.dist > 0) {
        scale = Math.max(0.2, Math.min(8, base.scale * (now.dist / base.dist)));
      }
      rotation = base.rotation + (now.angle - base.angle);
      tx = base.tx + (now.cx - base.cx);
      ty = base.ty + (now.cy - base.cy);
    }
  } else if (touches.length === 1) {
    const t = touches[0];
    if (!base || base.n !== 1) {
      base = {n: 1, cx: t.clientX, cy: t.clientY, tx: tx, ty: ty};
    } else {
      tx = base.tx + (t.clientX - base.cx);
      ty = base.ty + (t.clientY - base.cy);
    }
  } else {
    base = null;
  }

  guitar.style.transform =
    'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) ' +
    'scale(' + scale.toFixed(3) + ') rotate(' + rotation.toFixed(1) + 'deg)';
  show(touches);

  report(e.type, {
    contacts: touches.length, peak: peak,
    scale: Number(scale.toFixed(3)), rotation: Number(rotation.toFixed(1)),
    tx: Math.round(tx), ty: Math.round(ty),
    touches: touches.map(t => ({
      id: t.identifier,
      clientX: Math.round(t.clientX), clientY: Math.round(t.clientY),
    })),
  });
  e.preventDefault();
}

for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
  window.addEventListener(type, onTouch, {passive: false});
}

function announce() {
  report('ready', {
    screenW: screen.width, screenH: screen.height,
    innerW: window.innerWidth, innerH: window.innerHeight,
    dpr: window.devicePixelRatio,
    maxTouchPoints: navigator.maxTouchPoints,
  });
}
if (document.readyState === 'complete') announce();
else window.addEventListener('load', announce);
</script>
