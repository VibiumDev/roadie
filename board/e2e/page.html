<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>roadie e2e</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  body {
    font-family: ui-monospace, "DejaVu Sans Mono", monospace;
    background: #10131a; color: #e8ecf4;
    height: 100vh; overflow: hidden; font-size: 12px;
    display: flex; flex-direction: column;
  }
  header {
    padding: 4px 8px; background: #1b2030; border-bottom: 1px solid #2d3650;
    display: flex; justify-content: space-between; align-items: center;
  }
  h1 { font-size: 13px; letter-spacing: .5px; }
  #focus { font-size: 11px; padding: 1px 6px; border-radius: 3px; }
  .ok  { background: #1f7a4d; color: #fff; }
  .bad { background: #8a2435; color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  #pad {
    flex: 1; position: relative; background:
      repeating-linear-gradient(0deg, #171c28 0 39px, #1e2436 39px 40px),
      repeating-linear-gradient(90deg, #171c28 0 39px, #1e2436 39px 40px);
  }
  #log {
    width: 300px; overflow-y: auto; padding: 4px 6px;
    background: #0c0f16; border-left: 1px solid #2d3650; line-height: 1.5;
    /* Lines are dropped as new ones come in. A touch that began on one
       would go on being delivered to it after it is gone, never reaching
       the page's listeners; this way touches land on something that stays. */
    pointer-events: none;
  }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k { color: #ffd479; } .m { color: #7fd1ff; }
  .t { color: #b89cff; } .w { color: #7effb2; }
  #cursor, #touch {
    position: absolute; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%); transition: all .05s linear;
  }
  #cursor { width: 14px; height: 14px; border: 2px solid #7fd1ff; }
  #touch  { width: 34px; height: 34px; background: #b89cff66;
            border: 2px solid #b89cff; opacity: 0; }
  #typed {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    font-size: 20px; color: #ffd479; word-break: break-all;
    text-shadow: 0 0 8px #000;
  }
  #banner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 15px; color: #5c6a8a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
  <h1>🎸 roadie end-to-end input test</h1>
  <span id="focus" class="bad">no focus</span>
</header>
<main>
  <div id="pad">
    <div id="banner">waiting for input&hellip;<br><span style="font-size:11px">driven via roadie HTTP API &rarr; relay &rarr; HID &rarr; USB</span></div>
    <div id="cursor" style="left:-99px"></div>
    <div id="touch"></div>
    <div id="typed"></div>
  </div>
  <div id="log"></div>
</main>
<script>
const logEl = document.getElementById('log');
const padEl = document.getElementById('pad');
const cursorEl = document.getElementById('cursor');
const touchEl = document.getElementById('touch');
const typedEl = document.getElementById('typed');
const focusEl = document.getElementById('focus');
const bannerEl = document.getElementById('banner');

let typed = '';
let seq = 0;

// On iOS a tap whose touchstart or touchend is cancelled never gives the
// page keyboard focus, so typed keys go nowhere. So until the page has
// focus, those two are left alone there. Not for longer: left alone, Safari
// zooms on a quick second tap and scrolls the log under a drag, and the
// drag stops reaching the page.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

function paint(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  // Chronological, newest last: prepending read backwards, so a typed
  // string appeared in reverse down the column.
  logEl.append(d);
  while (logEl.childNodes.length > 60) logEl.firstChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}

// Every observation is posted straight to the harness. keepalive so a
// report still lands if the page is torn down right after.
function report(kind, data) {
  data.kind = kind;
  data.seq = seq++;
  data.hasFocus = document.hasFocus();
  fetch('/report', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
    keepalive: true,
  }).catch(() => {});
}

function refreshFocus() {
  const f = document.hasFocus();
  focusEl.className = f ? 'ok' : 'bad';
  focusEl.textContent = f ? 'focused' : 'no focus';
}
window.addEventListener('focus', refreshFocus);
window.addEventListener('blur', refreshFocus);
setInterval(refreshFocus, 500);

// --- keyboard -------------------------------------------------------------
window.addEventListener('keydown', (e) => {
  bannerEl.style.display = 'none';
  // Printable keys have single-character .key values; everything else is
  // a named key like "Enter" or "Shift". With Cmd or Ctrl it's a shortcut.
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
    typed += e.key;
  } else if (e.key === 'Backspace') {
    typed = typed.slice(0, -1);
  }
  typedEl.textContent = typed;
  paint('k', `keydown ${JSON.stringify(e.key)} code=${e.code}`);
  report('keydown', {key: e.key, code: e.code, typed: typed});
  // Shortcuts go through: cancelled here, Cmd+H and Cmd+Space on an iPhone
  // never reach the system while the page has the keyboard.
  const modifier = ['Meta', 'Control', 'Alt'].includes(e.key);
  if (!modifier && !e.metaKey && !e.ctrlKey && !e.altKey) e.preventDefault();
});

// --- mouse ----------------------------------------------------------------
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  bannerEl.style.display = 'none';
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = (e.clientY - padEl.offsetTop) + 'px';
  paint('m', `move client=${e.clientX},${e.clientY} screen=${e.screenX},${e.screenY}`);
  report('pointermove', {
    clientX: e.clientX, clientY: e.clientY,
    screenX: e.screenX, screenY: e.screenY,
    pointerType: e.pointerType,
  });
});

for (const type of ['mousedown', 'mouseup', 'click']) {
  window.addEventListener(type, (e) => {
    paint('m', `${type} btn=${e.button} @${e.clientX},${e.clientY}`);
    report(type, {clientX: e.clientX, clientY: e.clientY, button: e.button});
  });
}

for (const type of ['pointerdown', 'pointerup']) {
  window.addEventListener(type, (e) => {
    bannerEl.style.display = 'none';
    const cls = e.pointerType === 'touch' ? 't' : 'm';
    paint(cls, `${type} ${e.pointerType} btn=${e.button} @${e.clientX},${e.clientY}`);
    report(type, {
      clientX: e.clientX, clientY: e.clientY,
      screenX: e.screenX, screenY: e.screenY,
      button: e.button, buttons: e.buttons,
      pointerType: e.pointerType,
    });
    if (e.pointerType === 'touch') {
      touchEl.style.left = e.clientX + 'px';
      touchEl.style.top = (e.clientY - padEl.offsetTop) + 'px';
      touchEl.style.opacity = type === 'pointerdown' ? '1' : '0';
    }
    e.preventDefault();
  });
}

window.addEventListener('wheel', (e) => {
  bannerEl.style.display = 'none';
  paint('w', `wheel dy=${e.deltaY}`);
  report('wheel', {deltaY: e.deltaY, deltaX: e.deltaX});
  e.preventDefault();
}, {passive: false});

// --- raw touch ------------------------------------------------------------
for (const type of ['touchstart', 'touchmove', 'touchend']) {
  window.addEventListener(type, (e) => {
    bannerEl.style.display = 'none';
    const pts = Array.from(e.touches).map(t => ({
      id: t.identifier,
      clientX: Math.round(t.clientX), clientY: Math.round(t.clientY),
      screenX: Math.round(t.screenX), screenY: Math.round(t.screenY),
    }));
    const chg = Array.from(e.changedTouches).map(t => ({
      id: t.identifier,
      clientX: Math.round(t.clientX), clientY: Math.round(t.clientY),
      screenX: Math.round(t.screenX), screenY: Math.round(t.screenY),
    }));
    paint('t', `${type} n=${pts.length} ${chg.map(p => p.clientX + ',' + p.clientY).join(' ')}`);
    report(type, {touches: pts, changedTouches: chg});
    if (type === 'touchmove' || !IOS || document.hasFocus()) e.preventDefault();
  }, {passive: false});
}

// --- soundcheck -------------------------------------------------------------
// Holding the pointer still for a second arms the soundcheck; the next quick
// tap plays the five-note motif the audio tests use (board/test_audio.py), so
// the harness can listen for it coming out of the target. A page may only make
// sound in answer to a tap -- Safari doesn't count a long press as one.
const MOTIF = [['D5', 587.33, 0.40], ['E5', 659.25, 0.40], ['C5', 523.25, 0.40],
               ['C4', 261.63, 0.40], ['G4', 392.00, 1.70]];
const MOTIF_GAP = 0.15;
let hold = null;
let armed = false;
let audioCtx = null;
window.addEventListener('pointerdown', (e) => {
  hold = {t: e.timeStamp, x: e.clientX, y: e.clientY, moved: false};
}, true);
window.addEventListener('pointermove', (e) => {
  if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10) hold.moved = true;
}, true);
window.addEventListener('pointerup', (e) => {
  const still = hold && !hold.moved;
  const held = still ? e.timeStamp - hold.t : 0;
  hold = null;
  if (held >= 700) {
    armed = true;
    paint('w', 'soundcheck armed: tap to play');
    report('armed', {});
  } else if (armed && still) {
    armed = false;
    playMotif();
  }
}, true);
// Safari counts only the touch's own end as permission to play.
window.addEventListener('touchend', () => {
  if (audioCtx && audioCtx.state !== 'running') audioCtx.resume();
}, true);

function playMotif() {
  try {
    // Plays with the ringer switch on silent, as a video would.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (err) { /* older Safari */ }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  const lead = 0.25;
  let t = audioCtx.currentTime + lead;
  const notes = [];
  for (const [name, hz, secs] of MOTIF) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = hz;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.005);  // no clicks at the edges
    gain.gain.setValueAtTime(0.5, t + secs - 0.005);
    gain.gain.linearRampToValueAtTime(0, t + secs);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + secs + 0.01);
    notes.push({name, hz, secs, at: t - audioCtx.currentTime});
    t += secs + MOTIF_GAP;
  }
  paint('w', `motif playing (${audioCtx.state}, ${audioCtx.sampleRate} Hz)`);
  report('motif', {state: audioCtx.state, sampleRate: audioCtx.sampleRate});
  window.dispatchEvent(new CustomEvent('roadie:motif', {detail: {notes}}));
}

// Whether the page is on screen: the harness checks it got Safari back after
// sending it to the soundcheck page.
document.addEventListener('visibilitychange', () => {
  report('visible', {visible: document.visibilityState === 'visible'});
});

// --- announce readiness ---------------------------------------------------
function announce() {
  window.focus();
  report('ready', {
    screenW: window.screen.width, screenH: window.screen.height,
    innerW: window.innerWidth, innerH: window.innerHeight,
    dpr: window.devicePixelRatio,
    padTop: padEl.offsetTop,
    maxTouchPoints: navigator.maxTouchPoints,
    ua: navigator.userAgent,
  });
  paint('w', `ready ${window.innerWidth}x${window.innerHeight} dpr=${window.devicePixelRatio}`);
}
window.addEventListener('load', announce);
if (document.readyState === 'complete') announce();
</script>
</body>
</html>
