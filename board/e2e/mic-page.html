<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>roadie soundcheck</title>
<style>
  body { font-family: ui-monospace, monospace; background:#10131a; color:#e8ecf4;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; height:100vh; margin:0; gap:1rem; }
  #state { font-size:1.4rem; }
  #level { width:60%; height:18px; background:#1b2030; border:1px solid #2d3650; }
  #bar { height:100%; width:0; background:#7effb2; transition:width .05s; }
</style>
</head>
<body>
<h1>🎸 roadie soundcheck</h1>
<div id="state">starting…</div>
<div id="level"><div id="bar"></div></div>
<script>
// Captures the microphone and streams it to roadie's /audio-in as 16-bit
// PCM, the same shape the viewer's mic button sends. Under test the
// microphone is a file Chromium plays back, so the audio is known.
const params = new URLSearchParams(location.search);
// Served by roadie, so /audio-in is on this same origin unless told
// otherwise. Being same-origin is the point: /audio-in refuses anything else.
const target = params.get('roadie') || location.host;
// A test harness can ask to be told what happened, by passing its own URL.
// Reports go out as plain GETs so they need no CORS preflight.
const reportTo = params.get('report');
const RATE = 16000;
const stateEl = document.getElementById('state');
const barEl = document.getElementById('bar');

function report(what, extra) {
  if (!reportTo) return;
  const url = new URL(reportTo);
  url.searchParams.set('event', what);
  for (const [k, v] of Object.entries(extra || {})) {
    url.searchParams.set(k, String(v));
  }
  new Image().src = url.toString();
}

function say(text) { stateEl.textContent = text; }

(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {channelCount: 1, sampleRate: RATE,
              echoCancellation: false, noiseSuppression: false,
              autoGainControl: false},
    });

    const ws = new WebSocket('ws://' + target + '/audio-in');
    ws.binaryType = 'arraybuffer';
    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; });
    say('streaming');
    report('open');

    const ctx = new AudioContext({sampleRate: RATE});
    const src = ctx.createMediaStreamSource(stream);

    // An AudioWorklet, matching what the viewer's mic button uses. Handing
    // over 128 samples at a time keeps the flow even; sending in larger
    // bursts (a ScriptProcessor's 1024, say) arrives faster than the HID
    // board's ring buffer drains and the audio comes out broken up.
    const workletCode = [
      'class PCMSender extends AudioWorkletProcessor {',
      '  process(inputs) {',
      '    const ch = inputs[0][0];',
      '    if (ch) this.port.postMessage(ch.slice(0));',
      '    return true;',
      '  }',
      '}',
      "registerProcessor('pcm-sender', PCMSender);",
    ].join('\n');
    const url = URL.createObjectURL(
      new Blob([workletCode], {type: 'application/javascript'}));
    await ctx.audioWorklet.addModule(url);

    const node = new AudioWorkletNode(ctx, 'pcm-sender');
    let sent = 0;
    node.port.onmessage = (e) => {
      const input = e.data;
      const pcm = new Int16Array(input.length);
      let peak = 0;
      for (let i = 0; i < input.length; i++) {
        const v = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
        peak = Math.max(peak, Math.abs(v));
      }
      barEl.style.width = Math.round(peak * 100) + '%';
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(pcm.buffer);
        sent += pcm.length;
        if (sent % (RATE / 2) < input.length) report('sent', {samples: sent});
      }
    };
    src.connect(node);
  } catch (err) {
    say('failed: ' + err);
    report('error', {message: String(err)});
  }
})();
</script>
</body>
</html>
